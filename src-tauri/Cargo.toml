[package]
name = "atrium"
version = "1.2.48"
description = "Atrium"
edition = "2021"
rust-version = "1.77"

[lib]
name = "atrium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
serde_json = "1"

# Card 174 M-a: DPAPI (CryptProtectData) for the calendar refresh handle at rest.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# Card 195 (Critic 193 G2): AndroidKeyStore over JNI for the calendar session at rest.
# Same jni the tauri/wry Android runtime already uses (0.21.1 in Cargo.lock).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
